<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 800 100'
    style='background-color: #00000000;'
    width='800px' height='100px'>

    <style>
@font-face {
  font-family: 'Playfair Display';
  font-style: normal;
  font-weight: 500;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                    <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d2.end'
                    dur='7000ms' fill='remove'
                    values='m0,50 h0 ; m0,50 h800 ; m0,50 h800 ; m0,50 h0' keyTimes='0;0.57142857142857;0.85714285714286;1' />
                    </path>
    <text font-family='"Playfair Display", monospace' fill='#789282' font-size='26'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            Hi, I&#039;m zhuotong ☁️
        </textPath>
    </text>
        <path id='path1'>
                            <!-- Single line -->
                                <animate id='d1' attributeName='d' begin='d0.end'
                    dur='7000ms' fill='remove'
                    values='m0,50 h0 ; m0,50 h800 ; m0,50 h800 ; m0,50 h0' keyTimes='0;0.57142857142857;0.85714285714286;1' />
                    </path>
    <text font-family='"Playfair Display", monospace' fill='#789282' font-size='26'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path1'>
            Indie developer, building with AI agents.
        </textPath>
    </text>
        <path id='path2'>
                            <!-- Single line -->
                                <animate id='d2' attributeName='d' begin='d1.end'
                    dur='7000ms' fill='remove'
                    values='m0,50 h0 ; m0,50 h800 ; m0,50 h800 ; m0,50 h0' keyTimes='0;0.57142857142857;0.85714285714286;1' />
                    </path>
    <text font-family='"Playfair Display", monospace' fill='#789282' font-size='26'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path2'>
            Building in public, one commit at a time.
        </textPath>
    </text>
</svg>
